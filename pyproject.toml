[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Black configuration removed - using ruff-format instead

# isort configuration removed - using ruff-format instead

[tool.poetry]
name = "movici-api-client"
version = "0.1.0"
description = "Client library and CLI tool for interfacing with the Movici Cloud Platform"
authors = ["Pelle Koster <pelle.koster@nginfra.nl>"]
license = "Movici Public License"
readme = "README.rst"
packages = [{ include = "movici_api_client", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
httpx = "^0.23.1"
click = "^8.1.3"
questionary = "^1.10.0"
tabulate = "^0.9.0"
tqdm = "^4.64.1"
gimme-that = "^0.3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
pytest-asyncio = ">=0.25.0"
# black and isort removed - using ruff instead
mypy = ">=1.8.0"
ruff = ">=0.8.0"
bandit = ">=1.7.0"
pre-commit = ">=4.0.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.poetry.scripts]
movici = 'movici_api_client.cli:__main__'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # use of assert detected
    # Additional ignores for this legacy codebase
    "B904",  # use raise ... from err (too many changes needed)
    "UP038", # use X | Y in isinstance
    "S108",  # probable insecure usage of temp file/directory
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "S106", "S107", "S108", "C401"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert_used
